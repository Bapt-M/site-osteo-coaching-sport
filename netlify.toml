# ============================================================================
#  Déploiement Netlify
#
#  master        → production → https://osteo-et-coaching-du-sport.com
#  demonstration → démo       → https://demonstration.osteo-et-coaching-du-sport.com
#
#  La branche de démo s'appelle `demonstration` et non `dev` : les
#  sous-domaines de branche Netlify suivent le motif imposé
#  <nom-de-branche>.<domaine>. Renommer la branche renommerait l'URL.
#
#  Les redirections du site vivent dans public/_redirects : Vite les recopie
#  dans dist/ et elles doivent s'appliquer à TOUS les contextes.
# ============================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 exige Node >= 20.19. On fige la version pour que le build reste
  # reproductible le jour où Netlify changera sa valeur par défaut.
  NODE_VERSION = "22"

# Des [[headers]] déclarés ici seraient globaux, production comprise. Pour
# n'interdire l'indexation que sur les déploiements de démonstration, on
# dépose un _headers dédié dans dist/ à la fin du build de ces contextes.

# Le manifeste est servi en application/octet-stream si son type n'est pas
# déclaré ; Chrome refuse alors de l'interpréter. Cet en-tête vaut pour tous
# les contextes, il n'a donc pas à passer par un fichier _headers.

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[context.branch-deploy]
  command = "npm run build && cp deploy/_headers-demo dist/_headers"

[context.deploy-preview]
  command = "npm run build && cp deploy/_headers-demo dist/_headers"
